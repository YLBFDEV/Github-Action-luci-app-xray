name: Build luci-app-kms

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        
env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  CONFIG_FILE: x86_64.config
  DEPENDS_FILE: depends-ubuntu-2004

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt -qq update
        sudo -E apt -qq install -y $(cat "$DEPENDS_FILE" | tr -d '\r')
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        
    - name: Download SDK
      working-directory: /workdir
      run: |
        wget $SDK_URL -O sdk.tar.zst
        mkdir sdk
        tar -I zstd -xf sdk.tar.zst -C sdk --strip-components 1
        ln -sf /workdir/sdk $GITHUB_WORKSPACE/sdk
        
    #- name: Clone luci-app-kms
    #  working-directory: /workdir/sdk
    #  run: |
    #    git clone https://github.com/gaoderby/luci-app-kms.git package/luci-app-kms
        
    - name: Update feeds
      run: cd sdk && ./scripts/feeds update -a

    - name: Install feeds
      run: cd sdk && ./scripts/feeds install -a

    - name: Clone luci-app-kms (移到 Feed 安装之后)
      working-directory: /workdir/sdk
      run: |
        # 如果 feed 安装时创建了同名目录，先强行删掉，确保用你指定的 Git 源码
        if [ -d "package/luci-app-kms" ]; then
          echo "=====> 检测到已存在的 package/luci-app-kms 目录，正在清理..."
          rm -rf package/luci-app-kms
        else
          echo "=====> package/luci-app-kms 目录不存在，无需清理。"
        fi
        
        git clone https://github.com/gaoderby/luci-app-kms.git package/luci-app-kms
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Load custom configuration
      run: |
        if [ -e "$CONFIG_FILE" ]; then
          echo "发现自定义配置文件，正在应用..."
          cp "$CONFIG_FILE" sdk/.config
        else
          echo "未发现自定义配置文件，将使用 SDK 默认配置。"
        fi
        
    - name: Validate and Refresh Configuration
      id: check_config
      run: |
        cd sdk
        # 故意不加 TERM=xterm，且不给交互机会
        # 如果有任何依赖冲突或需要弹窗，make defconfig 会在这里直接报错熔断
        make defconfig
    
    - name: SSH Debug on Configuration Failure (条件触发)
      # 核心魔法：只有当上一步 Validate 失败（即需要弹窗/报错）时，才会启动 SSH
      if: failure() && steps.check_config.outcome == 'failure'
      uses: P3TERX/ssh2actions@v1.0.0
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        
    #- name: SSH connection to Actions
    #  uses: P3TERX/ssh2actions@v1.0.0
    #  if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')

    - name: Fix Configuration and Defconfig
      run: |
        cd sdk
        [ -f .config ] || make defconfig
        make defconfig
        
    - name: Compile the luci-app-kms
      id: compile
      env:
         TERM: xterm
      run: |
        cd sdk
        echo -e "$(nproc) thread compile"
        make package/luci-app-kms/compile -j$(nproc) || make package/luci-app-kms/compile -j1 || make package/luci-app-kms/compile -j1 V=sc

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      with:
        name: luci-app-kms
        path: sdk/bin
        
    - name: Upload bin to release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: sdk/bin/*
