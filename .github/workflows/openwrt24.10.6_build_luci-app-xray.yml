name: Build luci-app-xray

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  CONFIG_FILE: x86_64.config
  DEPENDS_FILE: depends-ubuntu-2004
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt -qq update
        if [ -f "$DEPENDS_FILE" ]; then
          echo "=====> 成功读取本地依赖文件: $DEPENDS_FILE <====="
          sudo -E apt -qq install -y $(cat "$DEPENDS_FILE" | tr -d '\r')
        else
          echo "=====> 错误: 未找到依赖文件 $DEPENDS_FILE ！ <====="
          exit 1
        fi
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        
    - name: Download SDK
      working-directory: /workdir
      run: |
        wget $SDK_URL -O sdk.tar.zst
        mkdir sdk
        tar -I zstd -xf sdk.tar.zst -C sdk --strip-components 1
        ln -sf /workdir/sdk $GITHUB_WORKSPACE/sdk

    - name: Link Repository & Refresh SDK Feeds
      working-directory: /workdir/sdk
      run: |
        # 1. 严格遵循文档：以 package/luci-app-xray 名字硬塞进 SDK 树
        rm -rf package/luci-app-xray
        git clone https://github.com/yichya/luci-app-xray.git package/luci-app-xray
        
        # 2. 执行官方说明书指定的 Feeds 同步动作，让 SDK 识别子目录 Makefile
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load and Refresh Configuration
      run: |
        cd sdk
        if [ -e "$CONFIG_FILE" ]; then
          echo "应用自定义配置文件..."
          cp "$CONFIG_FILE" .config
        else
          [ -f .config ] || make defconfig
        fi
        
        # 3. 强行勾选该仓库衍生出的三个真实 OpenWrt 目标包
        sed -i '/CONFIG_PACKAGE_luci-app-xray/d' .config
        sed -i '/CONFIG_PACKAGE_luci-app-xray-status/d' .config
        sed -i '/CONFIG_PACKAGE_luci-app-xray-geodata/d' .config
        
        echo "CONFIG_PACKAGE_luci-app-xray=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-xray-status=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-xray-geodata=m" >> .config
        
        # 4. 执行官方指定的验证固化命令
        make defconfig
    
    - name: SSH Debug on Configuration Failure (条件触发)
      if: failure() && steps.check_config.outcome == 'failure'
      uses: P3TERX/ssh2actions@v1.0.0
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    - name: Compile the luci-app-xray Packages
      env:
         TERM: xterm
      run: |
        cd sdk
        echo -e "$(nproc) thread compile"
        
        # 5. 【终极修正】依次点名编译各个独立的子 Makefile 目标
        # 优先编译核心 core，再编译 status 和 geodata
        
        echo "正在编译核心包 (core)..."
        make package/luci-app-xray/core/compile -j$(nproc) || make package/luci-app-xray/core/compile -j1 V=sc IGNORE_ERRORS=1
        
        echo "正在编译状态包 (status)..."
        make package/luci-app-xray/status/compile -j$(nproc) || make package/luci-app-xray/status/compile -j1 V=sc IGNORE_ERRORS=1
        
        echo "正在编译地理数据包 (geodata)..."
        make package/luci-app-xray/geodata/compile -j$(nproc) || make package/luci-app-xray/geodata/compile -j1 V=sc IGNORE_ERRORS=1

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-xray-ipks
        path: sdk/bin
    
    - name: Archive and Package IPKs
      if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
      run: |
        echo "=====> 正在精准抓取 luci-app-xray 相关的包... <====="
        cd sdk/bin
        
        # 1. 寻找所有文件名包含 luci-app-xray 的 ipk 文件
        TARGET_FILES=$(find . -name "*luci-app-xray*.ipk")
        
        if [ -z "$TARGET_FILES" ]; then
          echo "=====> 错误：没有找到任何 luci-app-xray 相关的 ipk 文件！ <====="
          exit 1
        fi
        
        echo "=====> 发现以下相关安装包，准备打包： <====="
        echo "$TARGET_FILES"
        
        # 2. 仅将这几个精准命中的 ipk 打包成压缩包
        tar -zcvf /workdir/luci-app-xray-only.tar.gz $TARGET_FILES   
        
    - name: Upload bin to release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "luci-app-xray-${{ github.run_id }}"
        name: "luci-app-xray 24.10 编译产物"
        # 🎯 仅上传这个只包含核心面板、status、geodata 插件的精简压缩包
        files: /workdir/luci-app-xray-only.tar.gz
